name: "JFrog-oidc-Fortescue-End2End-test"
on:
  workflow_dispatch:
    inputs:
      build_platform:
        required: false
        type: string
        default: 'arm64'
        description: The platform to build for (arm64 or amd64)

# This is required as per
# https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-cloud-providers#adding-permissions-settings
permissions:
  id-token: write
  contents: read

jobs:
  build:
     runs-on: ${{ inputs.build_platform == 'amd64' && format('codebuild-fdx-shared-gh-runners-amd-{0}-{1}-{2}', github.repository_owner, github.run_id, github.run_attempt) || format('codebuild-fdx-shared-gh-runners-arm-{0}-{1}-{2}', github.repository_owner, github.run_id, github.run_attempt) }}
     env:
      OIDC_PROVIDER: 'artifactory-staging'
      OIDC_AUDIENCE: 'fortescue-github-oidc'
      PLATFORM_REPO: 'sumtest-npm-virtual'    
      BUILD_NAME: "sumtest-fortescue-npm-build"
      BUILD_ID: "${{github.run_number}}"
      DOCKER_REPO: "sumtest-docker-virtual2"
      IMAGE_NAME: "fortescue-test-dockerbuild"
      IMAGE_TAG: "${{github.run_number}}"

     steps:
       - name: Checkout
         uses: actions/checkout@v3
              
       - name: Setup Node npm
         uses: actions/setup-node@v3
   
       - name: Setup JFrog CLI
         uses: jfrog/setup-jfrog-cli@v4
         env:  
           JF_URL: https://artifactory-staging.fortescue.com
         with:
           oidc-provider-name: ${{ env.OIDC_PROVIDER }}
           oidc-audience:  ${{ env.OIDC_AUDIENCE }}

       - name: Set CLI Config
         run: jf npm-config --repo-resolve=$PLATFORM_REPO --repo-deploy=$PLATFORM_REPO

       - name: Run Audit scan for the git workspace
         run: jf audit --watches sumtest-sec-malicious --fail=false
 
       - name: Install Dependencies
         run: jf npm install --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}} --project=sumtest
         
       - name: Publish
         run: jf npm publish --build-name=${{env.BUILD_NAME}} --build-number=${{env.BUILD_ID}} --project=sumtest


      # ── Docker Build ──────────────────────────────────────────────────────
       - name: Docker Build
         run: |
           jf docker build -t artifactory-staging.fortescue.com/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .  --project=sumtest

      # ── Docker Scan ───────────────────────────────────────────────────────
       - name: Docker Scan
         run: |
           jf docker scan artifactory-staging.fortescue.com/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --watches sumtest-sec-malicious --fail=false

      # ── Docker Push ───────────────────────────────────────────────────────
       - name: Docker Push
         run: |
           jf docker push artifactory-staging.fortescue.com/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} --build-name=${{ env.BUILD_NAME }} --build-number=${{ env.BUILD_ID }} --project=sumtest

      # ── Publish Build Info ────────────────────────────────────────────────
       - name: Get Build Info Details
         run: |
           jf rt bag "${{ env.BUILD_NAME }}" "${{ env.BUILD_ID }}" --project=sumtest
           jf rt bce "${{ env.BUILD_NAME }}" "${{ env.BUILD_ID }}" --project=sumtest
    
       
       - name: Publish build-info to Artifactory
         run: |
           jf rt bp ${{env.BUILD_NAME}} ${{ env.BUILD_ID }} --project=sumtest
          
       - name: Perform build scan
         run: |   
           jf bs ${{env.BUILD_NAME}} ${{ env.BUILD_ID }} --project=sumtest
